<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apple Watch — BaizerStore</title>
<meta name="description" content="Apple Watch Series, SE e Ultra lacrados, com garantia Apple de um ano.">
<link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
<main>

<section class="capa">
  <div class="wrap">
    <p class="eyebrow sobe">Apple Watch</p>
    <h1 class="sobe">O relógio definitivo.</h1>
    <p class="lead center sobe" style="margin:18px auto 0">Bateria para mais de um dia, a maior e mais brilhante tela em um Apple Watch, métricas avançadas e GPS de dupla frequência.</p>
    <div class="slot sobe" style="--ar:4/3"><img src="img/apple-watch.png" alt="Apple Watch"></div>
  </div>
</section>

<section class="sec">
  <div class="wrap center"></div>
  <div class="wrap">
    <div class="grid g3" id="grade"></div>
    <p class="note center sobe">Tamanho da caixa, cor da pulseira e versão com celular definidos no atendimento. Valores confirmados no momento da compra.</p>
  </div>
</section>

</main>
<script src="assets/site.js"></script>
<script>
grade('#grade', CATALOGO.watch, 'Um ano de garantia Apple');
</script>
</body>
</html>
